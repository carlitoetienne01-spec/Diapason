[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Diapason"
version = "1.0.0"
description = "Diapason — modular AI assistant backend with composable intelligence primitives"
readme = "README.md"
# Upper bound: numpy 2.2.x (pinned transitively via datasets/pandas) ships no
# cp314 Windows wheel, so under Python 3.14 uv would compile numpy from source
# (Meson) and fail on Windows boxes without a C toolchain (#350). Cap to the
# range that has prebuilt wheels; matches the classifiers (3.10–3.13).
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Open Diapason Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8",
    # Ed25519 for device identity: the mesh cannot treat its own identity as
    # optional, so this moved out of the `security-signing` extra.
    "cryptography>=43",
    "datasets>=4.5.0",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "openai>=1.30",
    "nvidia-ml-py>=12.560.30",
    "posthog>=3.0",
    "python-telegram-bot>=22.6",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9",
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
inference-mlx = ["mlx-lm>=0.31.1; sys_platform == 'darwin'"]
inference-vllm = ["vllm>=0.16.0"]
inference-cloud = [
    "openai>=1.30",
    "anthropic>=0.30",
]
inference-google = [
    "google-genai>=1.0",
]
inference-litellm = ["litellm>=1.40"]
inference-gemma = ["pygemma>=0.1.3"]
tools-search = [
    "tavily-python>=0.3",
    "ddgs>=9.11.4",
]
memory-faiss = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
memory-colbert = [
    "colbert-ai>=0.2",
    "torch>=2.0",
]
memory-pdf = ["pdfplumber>=0.10"]
memory-bm25 = ["rank-bm25>=0.2.2"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    # Native frontmost-app lookup, AX text insertion and clipboard-preserving
    # paste used by the deterministic lightning path on macOS.
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    # Le flux caméra des gestes (25/08/2026). Voir docs/spatial-mesh/GESTES.md :
    # la capture depuis ce processus est bloquée par TCC ; la dépendance est
    # déclarée pour que le module soit importable et testable.
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
]
# Push-to-talk dictation stack (macOS). The whole chain — global hotkey
# (CGEventTap), mic capture, clipboard paste, menu bar — is pure Python via
# PyObjC, so no compilation and no node-gyp. Platform-gated so a Linux/Windows
# install of the base package is unaffected.
dictation = [
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    # Le panneau de dictée affiche l'entité WebGL dans une WKWebView.
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
    "rumps>=0.4; sys_platform == 'darwin'",
]
openhands = ["openhands-sdk>=1.0; python_version >= '3.12'"]
gpu-metrics = ["pynvml>=12.0"]
energy-amd = ["amdsmi>=6.1"]
energy-apple = ["zeus-ml"]
energy-all = ["pynvml>=12.0", "amdsmi>=6.1", "zeus-ml"]
orchestrator-training = ["torch>=2.0", "transformers>=4.40"]
learning-dspy = ["dspy>=2.6"]
learning-gepa = ["gepa>=0.1"]
channel-telegram = ["python-telegram-bot>=21.0"]
channel-discord = ["discord.py>=2.3"]
channel-slack = ["slack-sdk>=3.27"]
channel-line = ["line-bot-sdk>=3.0"]
channel-viber = ["viberbot>=1.0"]
channel-messenger = ["pymessenger>=0.0.7"]
channel-reddit = ["praw>=7.0"]
channel-mastodon = ["Mastodon.py>=1.8"]
channel-xmpp = ["slixmpp>=1.8"]
channel-rocketchat = ["rocketchat-API>=1.30"]
channel-zulip = ["zulip>=0.9"]
channel-twitter = ["httpx>=0.27"]
channel-twitch = ["twitchio>=2.6"]
channel-nostr = ["pynostr>=0.6"]
channel-twilio = ["twilio>=9.0"]
channel-gmail = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
browser = ["playwright>=1.40"]
media = ["openai>=1.30"]
mining-pearl-vllm = ["docker>=7.0", "httpx>=0.27"]
pdf = ["pdfplumber>=0.10"]
scheduler = ["croniter>=2.0"]
security-signing = ["cryptography>=43"]
sandbox-wasm = ["wasmtime>=25"]
sandbox-docker = ["docker>=7.0"]
dashboard = ["textual>=0.80"]
speech = ["faster-whisper>=1.0"]
speech-wake = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.16",
]
speech-deepgram = ["deepgram-sdk>=3.0"]
# Fully local realtime voice: Whisper hears, Ollama thinks, Kokoro speaks.
# Kokoro's French G2P additionally needs espeak-ng (brew install espeak-ng).
voice-local = [
    "faster-whisper>=1.0",
    "kokoro>=0.9",
    "soundfile>=0.12",
    # Reconnaissance du locuteur (verrou vocal) : empreintes ONNX locales.
    "sherpa-onnx>=1.10",
]
eval-wandb = ["wandb>=0.17"]
eval-sheets = ["gspread>=6.0", "google-auth>=2.0"]
mining-pearl-cpu = [
    # Pearl Python packages (py-pearl-mining, miner-base, pearl-gateway) are
    # not on PyPI yet. They are installed at first `mine init` via the
    # build-from-pin path in src/diapason/mining/_install.py:build_from_pin().
    # When Pearl publishes wheels, replace the line below with version pins.
    #
    # The extra remains as a feature-flag namespace so users can run
    # `uv sync --extra mining-pearl-cpu` to opt-in (it succeeds with no
    # additional resolution today; the actual install happens on demand).
]
framework-comparison = ["polars>=1.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/carlitoetienne01-spec/Diapason"
Documentation = "https://carlitoetienne01-spec.github.io/Diapason/"
Repository = "https://github.com/carlitoetienne01-spec/Diapason"
Issues = "https://github.com/carlitoetienne01-spec/Diapason/issues"

[project.scripts]
diapason = "diapason.cli:main"
diapason-eval = "diapason.evals.cli:main"

[tool.uv]
# grpcio 1.78.1 was yanked upstream. Keep transitive optional stacks away
# from that release without making grpcio a mandatory Diapason dependency.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "authlib>=1.7.1",
    "cbor2>=5.9.0",
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "fastmcp>=3.2.0",
    "flask>=3.1.3",
    "gitpython>=3.1.58",
    "grpcio!=1.78.1",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "json-repair>=0.60.1",
    "litellm>=1.84.0",
    "lxml>=6.1.0",
    "mako>=1.3.12",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "pymdown-extensions>=11.0.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "torch>=2.13.0",
    "tornado>=6.5.7",
    "ujson>=5.13.0",
    "urllib3>=2.7.0",
    "vllm>=0.24.0",
    "werkzeug>=3.1.6",
]

[tool.uv.sources]
diapason-rust = { path = "rust/crates/diapason-python" }

[tool.hatch.build.targets.wheel]
packages = ["src/diapason"]

[tool.hatch.build.targets.wheel.force-include]
"src/diapason/agents/claude_code_runner" = "_node_modules/claude_code_runner"
"src/diapason/channels/whatsapp_baileys_bridge" = "_node_modules/whatsapp_baileys_bridge"
"scripts/install" = "_install_scripts"
"deploy/windows" = "_deploy/windows"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les marqueurs ci-dessous DÉCLARENT une dépendance externe — un moteur qui
# tourne, des clés d'API, des poids à télécharger — mais rien ne les excluait
# de la passe par défaut. Résultat : `pytest tests` était rouge en permanence
# sur toute machine ne réunissant pas ces conditions, et un rouge permanent
# apprend à ignorer le rouge. La description du marqueur `hub` disait déjà
# « exclu de la voie CI par défaut » : la politique existait, elle n'était pas
# appliquée.
#
# Chaque famille reste lançable expressément : `pytest -m live`, `-m cloud`,
# `-m hub`, etc.
addopts = "-m 'not live and not live_channel and not live_external and not cloud and not hub and not modal'"
markers = [
    "amd: requires AMD GPU",
    "apple: requires Apple Silicon",
    "cloud: requires cloud API keys",
    "docker: requires a working Docker daemon (no GPU required)",
    "live: requires running inference engine",
    "macos15: requires macOS 15+ (Sequoia) for Apple FM",
    "live_channel: requires real channel credentials (env vars)",
    "nvidia: requires NVIDIA GPU",
    "slow: long-running test",
    "hub: downloads real datasets from the HuggingFace Hub at runtime; excluded from the default CI lane (run with -m hub)",
    "live_external: requires HERMES_AGENT_PATH and OPENCLAW_PATH; spawns real foreign-framework subprocesses",
    "modal: requires Modal token + network; runs real swebench harness on Modal",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/diapason/evals/datasets/*.py" = ["E501"]
"src/diapason/evals/scorers/*.py" = ["E501"]
# hybrid/ is research code with long prompt strings and paradigm-specific
# config dicts — same relaxation as evals research code above. The ``**`` glob
# also covers subpackages (e.g. hybrid/skillorchestra/), which the prior
# ``hybrid/*.py`` glob missed.
"src/diapason/agents/hybrid/**/*.py" = ["E501"]
# research_loop.py carries long prompt strings too (documented in CLAUDE.md);
# the ignore was missing here.
"src/diapason/agents/research_loop.py" = ["E501"]
# Prompt content is intentionally kept as readable sentences.
"src/diapason/speech/realtime/oral_prompt.py" = ["E501"]
# Les colonnes des requêtes SQL restent alignées sur une ligne par groupe :
# les couper au caractère 88 rendrait chaque INSERT illisible sans rien
# protéger — une chaîne SQL n'a pas de longueur de ligne exécutable.
"src/diapason/succes/finances.py" = ["E501"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
# diapason_rust is the native PyO3 extension, built from the local Rust
# workspace. It lives in a uv dependency group (PEP 735) — not the published
# `desktop` extra — so `uv sync --group desktop-native` builds it from source
# for the desktop app, while `pip install diapason[desktop]` from PyPI does
# NOT try to resolve diapason-rust from PyPI, where it isn't published
# (dependency groups are excluded from wheel metadata). See #584 / #615.
desktop-native = [
    "diapason-rust",
]
