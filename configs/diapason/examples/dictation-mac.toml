# Dictation Mac — push-to-talk + polish + paste / voice commands
# Install: jarvis init --preset dictation-mac
#
# Desktop: hold Cmd+Alt+Space → STT → polish → dictionary → paste frontmost
#          or say "ouvre Cursor" / "open Spotify" → launches app
# Mic button hold: same finalize into chat (or runs command)
#
# Optional: copy configs/openjarvis/dictation_dictionary.example.json
#           to ~/.openjarvis/dictation_dictionary.json and edit words.
#
# Grant: Microphone + Accessibility for OpenJarvis

[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:4b"

[agent]
default_agent = "native_react"

[server]
host = "0.0.0.0"
port = 8000

[speech]

[dictation]
polish = true
dictionary = true
# dictionary_path = ""          # empty → ~/.openjarvis/dictation_dictionary.json
llm_polish = false              # opt-in LLM cleanup (needs engine + model)
email_mode = "off"              # off | on | auto
llm_timeout_ms = 2000
paste_to_frontmost = true
hotkey = "Cmd+Alt+Space"
ptt_hold = true
voice_commands = true
