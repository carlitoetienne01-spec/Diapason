# Heartbeat + routines — ambient queue + cron catalog
# Install: diapason init --preset heartbeat-routines
#
# 1) Enable scheduler + heartbeat in this config
# 2) diapason routines sync
# 3) diapason scheduler start
# 4) diapason heartbeat add "Check calendar before lunch"
# 5) diapason heartbeat tick --force   # drain one item now
#
# Quiet hours default 22:00–07:00 (no speak/notify delivery).
# Never auto-sends mail/SMS from heartbeat.

[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:4b"

[server]
host = "0.0.0.0"
port = 8000

[scheduler]
enabled = true
poll_interval = 60

[heartbeat]
enabled = true
interval_seconds = 1800
speak = false
notify = true
quiet_hours_enabled = true
quiet_hours_start = "22:00"
quiet_hours_end = "07:00"
tool_allowlist = "digest_collect,memory_search,think,calendar_query"

[routines]
enabled = true
allow_shell = false

[digest]
enabled = false
