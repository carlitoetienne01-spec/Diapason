title = "Diapason secret-scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, caches, build outputs, and Git internals"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.ruff_cache/''',
  '''(^|/)__pycache__/''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)site/''',
  '''(^|/)\.worktrees/''',
  '''(^|/)Inline/''',
  '''(^|/)scratch/''',
  '''^src/diapason/server/static/''',
]

[[allowlists]]
description = "Vecteurs de contrat du compte chiffré : clés de TEST dérivées de graines fixes par scripts/gen_vecteurs_compte.py, aucun secret réel. Leur entropie (3,75 à 3,95) déclencherait la règle generic-api-key sur une vingtaine de lignes."
paths = [
  '''^tests/contract/vecteurs_compte\.json$''',
]
