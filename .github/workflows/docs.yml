name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/diapason/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/diapason/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # SAUTE tant que les runners GitHub ne demarrent pas (facturation
    # bloquee depuis le 24 aout 2026). `deploy` en depend, donc les deux
    # s'eteignent ensemble et la publication ne part pas a moitie.
    #
    # Ce job ne va PAS sur le runner local : il publie sur GitHub Pages, ce
    # qui demande l'environnement `github-pages` et son jeton — un runner
    # auto-heberge le ferait echouer au dernier moment plutot qu'au premier.
    #
    # CE QUE CELA COUTE : la documentation en ligne cesse d'etre mise a jour
    # et vieillit en silence. Elle contredit deja le code par endroits (voir
    # docs/deployment/launchd.md), donc ce silence est a surveiller.
    #
    # POUR LE RALLUMER : variable de depot RUNNERS_GITHUB = true.
    if: vars.RUNNERS_GITHUB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build documentation
        run: uv run mkdocs build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
