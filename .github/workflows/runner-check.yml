# Essai du runner auto-hebergé — temporaire, a supprimer une fois la reponse
# obtenue.
#
# La question a laquelle ce fichier repond : un job PEUT-IL demarrer sur un
# runner auto-hebergé alors que le compte GitHub est en defaut de paiement ?
# Les runners heberges par GitHub ne demarrent plus depuis le 24 aout 2026
# (« recent account payments have failed »). Les runners auto-heberges ne
# consomment aucune minute facturable — mais rien ne dit qu'un compte en
# defaut ne les bloque pas aussi. Mesurer plutot que supposer.
name: Runner check

on:
  workflow_dispatch:

jobs:
  ou-suis-je:
    runs-on: [self-hosted, macos-local]
    steps:
      - name: Dire ou l on tourne
        run: |
          echo "hote      : $(hostname)"
          echo "systeme   : $(sw_vers -productVersion 2>/dev/null || uname -s)"
          echo "arch      : $(uname -m)"
          echo "runner    : $RUNNER_NAME"
          echo "repertoire: $(pwd)"
