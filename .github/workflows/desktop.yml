name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'deploy/windows/update-local-runner.ps1'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.2.dev500). If set, autotag dispatches use this. github.ref still controls the checkout.'
        required: false
        type: string
      deploy_windows:
        description: 'Update the installed Windows PC after its NSIS installer builds.'
        required: false
        default: false
        type: boolean
      dry_run_macos:
        description: 'Build the macOS release (dmg, updater bundle, backend assets) on the Mac runner and keep it as a workflow artifact — no GitHub release is created or touched. (Windows always builds in dry run on a dispatch.)'
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    # La validation ne publie aucun artefact et n'a besoin que d'un système
    # natif Tauri. Le Mac auto-hébergé la garde active même lorsque les minutes
    # GitHub sont bloquées. Les vraies constructions Linux/Windows restent
    # séparées ci-dessous : un Mac vert ne prétend pas valider ces plateformes.
    runs-on: [self-hosted, macos-local]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && echo '<html><body></body></html>' > frontend/dist/index.html

      # `cargo test` builds the crate (same coverage as the old `cargo check`)
      # and runs the unit tests, including the #331 uv-sync error-formatting
      # helpers. Static command, no untrusted input — no injection surface.
      - name: Cargo test
        working-directory: frontend/src-tauri
        run: cargo test

  # Windows, sur le PC de bureau de Carlito. Deux modes, comme le job macOS :
  # un tag `desktop-v*` publie dans la release ; un `workflow_dispatch` garde
  # tout en artefact (et, si `deploy_windows`, met à jour le PC lui-même).
  #
  # NSIS, et non plus MSI (13 septembre 2026) : WiX vérifie le .msi en
  # passant par le service Windows Installer, injoignable depuis le compte du
  # runner — « The Windows Installer Service could not be accessed », job
  # rouge depuis le 13 septembre. NSIS s'en passe, et c'est le format que
  # Tauri recommande pour l'updater : le `-setup.exe` signé EST l'artefact
  # de mise à jour.
  #
  # Le job publie ce que l'amorçage attend sur Windows : la wheel
  # `win_amd64` de diapason_rust (sans elle, l'app exigerait Rust), et
  # complète `backend.json` et `latest.json` — écrits par le job macOS, qui
  # passe donc AVANT sur un tag.
  publish-windows-local:
    needs: [validate, publish-macos-local]
    if: >-
      always() && vars.RUNNER_WINDOWS_LOCAL == 'true' &&
      needs.validate.result == 'success' &&
      (
        (startsWith(github.ref, 'refs/tags/desktop-v') && needs.publish-macos-local.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.publish-macos-local.result != 'failure')
      )
    runs-on: [self-hosted, windows-local]
    defaults:
      # Le service du runner interdit les `.ps1` temporaires et son `bash`
      # System32 ouvre WSL. Les commandes ordinaires sont toutes natives.
      run:
        shell: cmd
    env:
      RELEASES_REPO: ${{ vars.DIAPASON_RELEASES_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      PS: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:
      - uses: actions/checkout@v6
        with:
          # Le déployeur transfère le commit depuis ce checkout local vers
          # l'installation de Carlito. Avec la profondeur 1 par défaut, Git
          # refuse ce fetch : « shallow roots are not allowed to be updated ».
          # L'historique complet rend aussi vérifiable le fast-forward avant
          # que le service et l'installateur installés soient touchés.
          fetch-depth: 0

      - name: Expose Git Bash to composite actions
        # `dtolnay/rust-toolchain` possede ses propres etapes `shell: bash`.
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: La version du tag est celle de l'app
        id: version
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = (Get-Content frontend\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/desktop-v*') {
            $tag = "${{ github.ref_name }}"
            if ($tag.Substring(9) -ne $conf) { throw "le tag $tag ne correspond pas a la version de l'app ($conf)" }
          } else { $tag = "desktop-v$conf" }
          "version=$conf" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $conf, tag $tag"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target
            rust -> target

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: uv (archive officielle, sans installation)
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'uv'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest 'https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip' -OutFile "$dir\uv.zip"
          Expand-Archive "$dir\uv.zip" -DestinationPath $dir -Force
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "$dir\uv.exe" --version

      - name: Wheel Windows de diapason_rust
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # Un venv jetable avec le Python de la wheel - le meme que
          # `backend.json` annonce (3.13) : pyo3 n'est pas abi3.
          uv venv --python 3.13 .venv-assets
          uv pip install --python .venv-assets maturin
          New-Item -ItemType Directory -Path dist\release -Force | Out-Null
          & .venv-assets\Scripts\maturin.exe build --release `
            --manifest-path rust\crates\diapason-python\Cargo.toml `
            --interpreter (Resolve-Path .venv-assets\Scripts\python.exe).Path `
            --out dist\release
          $roue = Get-ChildItem dist\release -Filter 'diapason_rust-*.whl' | Select-Object -First 1
          if (-not $roue) { throw 'aucune wheel produite' }
          Write-Host "wheel : $($roue.Name)"

      - name: Tauri build (installateur NSIS signe)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `--verbose` : le banc doit conserver la commande et la sortie du
        # fabricant d'installateur - c'est la seule preuve exploitable quand
        # un runner physique differe de windows-latest.
        run: npx tauri build --verbose --config src-tauri\tauri.windows.conf.json

      - name: Rassembler la release Windows
        id: local-release
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'frontend\src-tauri\target\release\bundle\nsis'
          $exe = Get-ChildItem $bundle -Filter '*-setup.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Tauri reported success but produced no NSIS installer.' }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "pas de signature $sig - la cle n'a pas ete prise en compte" }
          Copy-Item $exe.FullName dist\release\
          Copy-Item $sig dist\release\
          # Ce que l'amorcage lira dans backend.json, et l'updater dans latest.json.
          $roue = (Get-ChildItem dist\release -Filter 'diapason_rust-*.whl' | Select-Object -First 1).Name
          @{ cible = 'x86_64-pc-windows-msvc'; roue = $roue; installateur = $exe.Name; signature = (Get-Content $sig -Raw).Trim() } |
            ConvertTo-Json | Out-File dist\release\windows.json -Encoding utf8
          # Une copie hors du `_work` nettoye entre les runs - le service tourne
          # comme NETWORK SERVICE, son LOCALAPPDATA n'est pas celui de Carlito.
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $destination = Join-Path $runnerRoot 'artifacts'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item $exe.FullName (Join-Path $destination $exe.Name) -Force
          "path=$(Join-Path $destination $exe.Name)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "### Windows ${env:VERSION} (${env:TAG})" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- $($exe.Name) - SHA-256 ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- $roue" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-ChildItem dist\release

      - name: Garder la release comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: diapason-windows-release-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error

      - name: Publier dans la release ${{ steps.version.outputs.tag }}
        if: env.DRY_RUN != 'true'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "https://api.github.com/repos/$env:RELEASES_REPO"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          function Get-Release($tag) { Invoke-RestMethod -Headers $h "$api/releases/tags/$tag" }
          function Upload-Asset($release, $path) {
            $name = Split-Path $path -Leaf
            $existing = $release.assets | Where-Object { $_.name -eq $name }
            if ($existing) { Invoke-RestMethod -Method Delete -Headers $h "$api/releases/assets/$($existing.id)" | Out-Null }
            $upload = $release.upload_url -replace '\{\?name,label\}', "?name=$([uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Headers ($h + @{ 'Content-Type' = 'application/octet-stream' }) -InFile $path $upload | Out-Null
            Write-Host "envoye : $name"
          }
          $release = Get-Release $env:TAG
          $meta = Get-Content dist\release\windows.json -Raw | ConvertFrom-Json
          # backend.json et latest.json du job macOS, completes par Windows.
          $backend = Invoke-RestMethod "https://github.com/$env:RELEASES_REPO/releases/download/$env:TAG/backend.json"
          $backend.wheels | Add-Member -NotePropertyName $meta.cible -NotePropertyValue $meta.roue -Force
          $backend | ConvertTo-Json -Depth 5 | Out-File dist\release\backend.json -Encoding utf8
          $latest = Invoke-RestMethod "https://github.com/$env:RELEASES_REPO/releases/download/$env:TAG/latest.json"
          $latest.platforms | Add-Member -NotePropertyName 'windows-x86_64' -NotePropertyValue @{
            signature = $meta.signature
            url = "https://github.com/$env:RELEASES_REPO/releases/download/$env:TAG/$($meta.installateur)"
          } -Force
          $latest | ConvertTo-Json -Depth 5 | Out-File dist\release\latest.json -Encoding utf8
          foreach ($f in @($meta.installateur, "$($meta.installateur).sig", $meta.roue, 'backend.json', 'latest.json')) {
            Upload-Asset $release (Resolve-Path "dist\release\$f").Path
          }
          # Le canal que l'app interroge : le meme latest.json, desormais a deux plateformes.
          Upload-Asset (Get-Release 'desktop-latest') (Resolve-Path 'dist\release\latest.json').Path
          Write-Host "Publie : https://github.com/$env:RELEASES_REPO/releases/tag/$env:TAG"

      - name: Update the installed Windows PC
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_windows == true
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          DIAPASON_INSTALLER: ${{ steps.local-release.outputs.path }}
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\windows\update-local-runner.ps1" `
            -CheckoutSha "$env:GITHUB_SHA" `
            -MsiPath "$env:DIAPASON_INSTALLER"

  # La publication macOS, sur le Mac de Carlito. Les runners GitHub sont
  # bloqués (facturation) : la matrice `build-and-release` ci-dessous ne
  # démarre plus. Ce job est la seule voie réelle vers une release, et il
  # publie TOUT ce que l'app installée attend, à la même version :
  #
  #   Diapason_<v>_aarch64.dmg        ce que l'utilisateur télécharge
  #   Diapason.app.tar.gz + .sig      ce que l'updater installe (minisign)
  #   latest.json                     le manifeste de l'updater, miroité
  #                                   ensuite dans `desktop-latest`
  #   backend.json, diapason-src-<v>.tar.gz, diapason_rust-….whl
  #                                   ce que l'amorçage télécharge au premier
  #                                   lancement (docs/premier-lancement.md)
  #
  # Apple Silicon seulement : ce Mac est le seul constructeur, et la wheel
  # de l'extension native n'existe que pour lui. Un Intel recevrait un dmg
  # qui ne s'ouvre pas et un amorçage qui exige cargo — mieux vaut ne rien
  # promettre. La signature Apple reste « - » (ad hoc) tant qu'aucun compte
  # Developer n'existe : Gatekeeper dira « endommagé » au premier clic.
  publish-macos-local:
    needs: [validate]
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run_macos == true)
    runs-on: [self-hosted, macos-local]
    defaults:
      run:
        shell: bash
    env:
      # Où publier. Par défaut ce dépôt ; une variable `DIAPASON_RELEASES_REPO`
      # (owner/nom) redirige vers un dépôt public de releases si celui-ci reste
      # privé — les assets d'un dépôt privé ne se téléchargent pas sans jeton,
      # et l'app installée n'en a aucun. Un autre dépôt exige aussi le secret
      # `RELEASES_TOKEN` (PAT avec `contents: write` dessus).
      RELEASES_REPO: ${{ vars.DIAPASON_RELEASES_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_macos == true }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: La version du tag est celle de l'app
        id: version
        run: |
          set -euo pipefail
          CONF="$(python3 -c "import json;print(json.load(open('frontend/src-tauri/tauri.conf.json'))['version'])")"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' frontend/src-tauri/Cargo.toml | head -1)"
          if [[ "$CONF" != "$CARGO" ]]; then
            echo "::error::tauri.conf.json dit $CONF, Cargo.toml dit $CARGO — lance scripts/bump-desktop-version.sh"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "${TAG#desktop-v}" != "$CONF" ]]; then
              # L'app cherche son backend et ses mises à jour sous SA version :
              # un tag qui dit autre chose publierait des fichiers introuvables.
              echo "::error::le tag $TAG ne correspond pas à la version de l'app ($CONF)"
              exit 1
            fi
          else
            TAG="desktop-v${CONF}"
          fi
          echo "version=${CONF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version ${CONF}, tag ${TAG}"

      - name: La clé de signature de l'updater est là
        if: env.DRY_RUN != 'true'
        env:
          CLE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLE" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY manque — sans elle, aucune app installée n'acceptera cette version (docs/desktop-auto-update.md)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target
            rust -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: uv
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv --version

      - name: Backend assets (code, wheel, manifeste)
        run: |
          set -euo pipefail
          # Un venv jetable avec le Python de la wheel : le runner n'a pas le
          # .venv du dépôt, et il ne doit pas en dépendre.
          uv venv --python 3.13 .venv-assets
          uv pip install --python .venv-assets maturin
          PYTHON="$PWD/.venv-assets/bin/python" MATURIN="$PWD/.venv-assets/bin/maturin" \
            ./scripts/build-backend-assets.sh "$PWD/dist/release"

      - name: Tauri build (dmg + bundle updater signé)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Rassembler la release et écrire latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          B="frontend/src-tauri/target/aarch64-apple-darwin/release/bundle"
          OUT="$PWD/dist/release"
          DMG="$(ls "$B"/dmg/Diapason_*_aarch64.dmg | head -1)"
          APP_TGZ="$B/macos/Diapason.app.tar.gz"
          SIG="$APP_TGZ.sig"
          for f in "$DMG" "$APP_TGZ"; do
            [[ -s "$f" ]] || { echo "::error::manque $f"; exit 1; }
          done
          if [[ "$DRY_RUN" != "true" && ! -s "$SIG" ]]; then
            echo "::error::pas de signature $SIG — la clé n'a pas été prise en compte"
            exit 1
          fi
          cp "$DMG" "$APP_TGZ" "$OUT/"
          [[ -s "$SIG" ]] && cp "$SIG" "$OUT/"
          # latest.json, à la main : tauri-action le faisait, mais il n'y a
          # plus de runner GitHub pour le lancer. Le champ `platforms` est
          # indexé par `<os>-<arch>` de la cible Tauri.
          python3 - "$OUT" "$VERSION" "$TAG" "$RELEASES_REPO" <<'PY'
          import datetime, json, os, sys
          out, version, tag, repo = sys.argv[1:]
          sig_path = os.path.join(out, "Diapason.app.tar.gz.sig")
          signature = open(sig_path).read().strip() if os.path.exists(sig_path) else ""
          manifest = {
            "version": version,
            "notes": f"Diapason {version}",
            "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
                "darwin-aarch64": {
                    "signature": signature,
                    "url": f"https://github.com/{repo}/releases/download/{tag}/Diapason.app.tar.gz",
                }
            },
          }
          json.dump(manifest, open(os.path.join(out, "latest.json"), "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          ls -la "$OUT"
          {
            echo "### macOS ${VERSION} (${TAG})"
            echo '```'
            (cd "$OUT" && shasum -a 256 ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder la release comme artefact (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diapason-macos-release-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error

      - name: Publier la release ${{ steps.version.outputs.tag }}
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$RELEASES_REPO" \
              --title "Diapason ${VERSION}" \
              --notes "Diapason ${VERSION} pour macOS (Apple Silicon). Télécharge le .dmg ; l'app installe le reste au premier lancement." \
              --latest
          fi
          gh release upload "$TAG" dist/release/* --repo "$RELEASES_REPO" --clobber
          echo "Publié : https://github.com/${RELEASES_REPO}/releases/tag/${TAG}"

      - name: Pointer le canal desktop-latest sur cette version
        if: env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # C'est ce `latest.json` que l'app installée interroge toutes les
          # 30 minutes (tauri.conf.json → plugins.updater.endpoints).
          if ! gh release view desktop-latest --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$RELEASES_REPO" \
              --prerelease \
              --title "Desktop Auto-Update Channel" \
              --notes "Canal de mise à jour de l'app de bureau : miroir du dernier \`desktop-v*\` stable. Télécharge l'app depuis la dernière release stable, pas ici."
          fi
          gh release upload desktop-latest dist/release/latest.json --repo "$RELEASES_REPO" --clobber
          echo "desktop-latest → ${TAG}"

  # Remove stale artifacts from the desktop-edge rolling pre-release so that
  # only the current build's files are available for download. (The stable
  # `desktop-latest` channel the installed app polls is never cleaned here.)
  clean-release:
    needs: [validate]
    # Hosted release jobs are intentionally absent while account billing keeps
    # them from starting. Set RUNNERS_GITHUB=true to restore the original
    # Linux/macOS/Windows publication matrix.
    if: vars.RUNNERS_GITHUB == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets from desktop-edge
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-edge"
          # List all asset IDs on the release and delete them
          ASSET_IDS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '.assets[].id' 2>/dev/null || true)
          for id in $ASSET_IDS; do
            echo "Deleting asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done

  build-and-release:
    needs: [validate, clean-release]
    if: vars.RUNNERS_GITHUB == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-14
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the workflow_dispatch fallback in
          # "Determine release info" can derive the dev version from the
          # latest release tag (#526).
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Determine release info
        id: release-info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            # Explicit stable desktop release tag
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#desktop-v}"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Desktop ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Auto-tagged rolling build from autotag.yml — use the same
            # version as the CLI/PyPI release so all surfaces stay in sync.
            # Rolling/dev builds go to the `desktop-edge` channel, NOT the
            # `desktop-latest` channel the installed app polls — so users on
            # stable are never auto-updated onto an unvetted dev build.
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch fallback (manual UI dispatch without --ref).
            # Derive a PEP 440 dev version aligned with autotag.yml so we
            # don't burn the X.Y.Z release-version namespace.
            # pyproject.toml no longer carries a static version (#526), so the
            # base comes from the latest plain release tag (vX.Y.Z), matching
            # autotag.yml. .dev/.rc/desktop-* tags are excluded.
            LATEST_RELEASE=$(git tag --list 'v[0-9]*' --merged HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$LATEST_RELEASE" ]]; then
              echo "::error::No release tag (vX.Y.Z) reachable from HEAD"
              exit 1
            fi
            BASE="${LATEST_RELEASE#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3 | sed -E 's/[^0-9].*$//')
            NEXT_PATCH=$((PATCH + 1))
            BUILD=$(git rev-list --count HEAD)
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}.dev${BUILD}"
            # Manual dispatches are also dev builds -> the edge channel.
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Tauri's build script requires strict SemVer (MAJOR.MINOR.PATCH[-pre][+build]).
          # PEP 440 dev releases (`1.0.2.dev661`) are NOT valid SemVer, so we
          # translate `.devN` to the SemVer-equivalent `-dev.N` prerelease form.
          # PyPI keeps the PEP 440 form; only the Tauri bundle uses SemVer.
          TAURI_VERSION="${VERSION/.dev/-dev.}"
          echo "tauri_version=${TAURI_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
            echo "APPLE_ID=$A_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$A_PASS" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$A_TEAM" >> "$GITHUB_ENV"
            echo "Apple signing configured"
          else
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::Apple signing secrets are required for release builds"
              exit 1
            fi
            echo "No Apple certificate configured, skipping code signing"
          fi

      - name: Build and release
        timeout-minutes: 120
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"version":"${{ steps.release-info.outputs.tauri_version }}"}'
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: ${{ steps.release-info.outputs.tag }}
          releaseName: ${{ steps.release-info.outputs.name }}
          releaseBody: 'Desktop application built from ${{ github.sha }}'
          releaseDraft: false
          prerelease: ${{ steps.release-info.outputs.prerelease }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # When a stable `desktop-v*` release is published, repoint the
  # `desktop-latest` auto-update channel (the endpoint the installed app
  # polls) at it. The stable release's own `latest.json` already references
  # this release's signed assets, so we copy it verbatim — installed apps are
  # only ever offered vetted stable builds, never `desktop-edge` dev builds.
  refresh-stable-channel:
    needs: [build-and-release]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Mirror stable latest.json into desktop-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The stable release's updater manifest may take a moment to become
          # downloadable after tauri-action publishes it; retry briefly.
          URL="https://github.com/${REPO}/releases/download/${STABLE_TAG}/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o latest.json "$URL"; then
              echo "Fetched ${STABLE_TAG}/latest.json on attempt ${attempt}"
              break
            fi
            echo "latest.json not ready yet (attempt ${attempt}); sleeping 15s"
            sleep 15
          done
          test -s latest.json || { echo "::error::Could not fetch ${URL}"; exit 1; }
          # Ensure the channel release exists (prerelease so it never usurps
          # the stable "Latest" badge), then replace its manifest in place.
          if ! gh release view desktop-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$REPO" \
              --prerelease \
              --title "Desktop Auto-Update Channel" \
              --notes "Auto-update channel pointer for the desktop app. Mirrors the latest stable \`desktop-v*\` release; the in-app updater polls this \`latest.json\`. Download the app from the latest stable release, not here."
          fi
          gh release upload desktop-latest latest.json --repo "$REPO" --clobber
          echo "desktop-latest now mirrors ${STABLE_TAG}"
