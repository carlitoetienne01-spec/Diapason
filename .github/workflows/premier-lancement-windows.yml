name: Installation et premier lancement Windows publiés

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bêta Windows déjà publiée à tester
        required: true
        type: string
      installer_sha256:
        description: Empreinte du véritable installateur publié
        required: true
        type: string
      scenario:
        description: Profil neuf ou reprise synthétique avec données et ancien serveur
        required: true
        type: choice
        default: fresh
        options: [fresh, legacy]

permissions:
  contents: read

concurrency:
  group: premier-lancement-windows
  cancel-in-progress: false

jobs:
  installer:
    runs-on: [self-hosted, windows-local]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
    env:
      INSTALLATION_VERSION: ${{ inputs.version }}
      INSTALLATION_SHA256: ${{ inputs.installer_sha256 }}
      INSTALLATION_SCENARIO: ${{ inputs.scenario }}
      BANC_COMMIT: ${{ github.sha }}
      BANC_SCRIPT_SHA256: 8c78ca329319fea4c6d1f38f8c6679bf97ca9a77c99cbaaf2b31f388b6aef41a
      BANC_TEST_SHA256: 9bbe8fd52ec8d1a68fae51c7cd04b41740d471d6e962758a9af742c832ef83f5

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'

      - name: Recevoir les deux fichiers vérifiés du banc
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BANC_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Commit invalide' }
          $banc = Join-Path $env:RUNNER_TEMP ('diapason-installation-banc-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $banc) { throw 'Banc deja present' }
          New-Item -ItemType Directory -Path $banc | Out-Null
          # 07/11/2026 : checkout nettoyait un ancien workspace volumineux
          # avant l'essai. Deux fichiers du commit immuable suffisent ici.
          $fichiers = @(
            @{ path='scripts/tester_installation_windows.mjs'; sha=$env:BANC_SCRIPT_SHA256 },
            @{ path='tests/deployment/premier_lancement_windows.test.mjs'; sha=$env:BANC_TEST_SHA256 }
          )
          foreach ($fichier in $fichiers) {
            $cible = Join-Path $banc $fichier.path
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $cible) | Out-Null
            $uri = 'https://raw.githubusercontent.com/carlitoetienne01-spec/Diapason/{0}/{1}' -f $env:BANC_COMMIT, $fichier.path
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $cible -TimeoutSec 60
            $recu = (Get-FileHash -LiteralPath $cible -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($recu -ne $fichier.sha) { throw 'Empreinte du banc divergente' }
          }

      - name: Contrôles du banc sans lancer l'application
        run: |
          $banc = Join-Path $env:RUNNER_TEMP ('diapason-installation-banc-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          node --test (Join-Path $banc 'tests/deployment/premier_lancement_windows.test.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Contrats du banc refuses' }

      - name: Installer le véritable EXE et vérifier le scénario choisi
        run: |
          $ErrorActionPreference = 'Stop'
          $travail = Join-Path $env:RUNNER_TEMP ('diapason-installation-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $banc = Join-Path $env:RUNNER_TEMP ('diapason-installation-banc-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $travail) { throw 'Dossier d essai deja present' }
          node (Join-Path $banc 'scripts/tester_installation_windows.mjs') `
            --version $env:INSTALLATION_VERSION `
            --sha256 $env:INSTALLATION_SHA256 `
            --scenario $env:INSTALLATION_SCENARIO `
            --workdir $travail
          if ($LASTEXITCODE -ne 0) { throw 'Installation ou premier lancement refuses. Voir resultat.json' }

      - name: Restaurer aussi après interruption du banc
        if: always()
        run: |
          $travail = Join-Path $env:RUNNER_TEMP ('diapason-installation-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $banc = Join-Path $env:RUNNER_TEMP ('diapason-installation-banc-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $script = Join-Path $banc 'scripts/tester_installation_windows.mjs'
          if (Test-Path -LiteralPath $script) {
            node $script --restore-workdir $travail
            if ($LASTEXITCODE -ne 0) { throw 'Restauration Windows requise. Sauvegarde conservee dans LocalAppData/DiapasonInstallationTests.' }
          }

      - name: Garder seulement les preuves synthétiques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows-${{ github.run_id }}-${{ github.run_attempt }}
          # 07/11/2026 : le dossier parent contient les clés locales du profil
          # d'essai. Seul rapport/ est publiable, jamais le profil ou les logs.
          path: ${{ runner.temp }}/diapason-installation-${{ github.run_id }}-${{ github.run_attempt }}/rapport/
          if-no-files-found: warn
          retention-days: 14
