name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # RUNNER AUTO-HEBERGE — pansement, pas solution. A retirer quand la
    # facturation GitHub sera reglee (voir CLAUDE.md, section 2).
    #
    # Depuis le 24 aout 2026, aucun runner heberge par GitHub ne demarre :
    # « recent account payments have failed ». Mesure le 26 aout : un runner
    # AUTO-HEBERGE demarre, lui — le blocage ne porte que sur les minutes
    # facturees. Ce job tourne donc sur le Mac de Carlito.
    #
    # CE QUE CELA COUTE, et il faut le savoir : ce job verifiait Ubuntu, il
    # verifie maintenant macOS. Un defaut propre a Linux — un chemin, une
    # locale, une permission, une dependance systeme — ne sera plus attrape.
    # Un test qui tourne sur macOS vaut mieux qu'un test qui ne tourne pas,
    # mais ce n'est pas le meme test.
    #
    # POUR REVENIR EN ARRIERE : remplacer la ligne ci-dessous par
    #     runs-on: ubuntu-latest
    runs-on: [self-hosted, macos-local]
    steps:
      - uses: actions/checkout@v6

      # Pas de setup-python : `uv` telecharge et gere son propre Python, et
      # le fait mieux ici. `actions/setup-python` sur macOS recupere un
      # paquet dont le script d'installation code /Users/runner/hostedtoolcache
      # EN DUR — le chemin des machines de GitHub. Sur un runner
      # auto-heberge il echoue avant tout le reste :
      #     ##[error]mkdir: /Users/runner: Permission denied
      # et ni RUNNER_TOOL_CACHE ni AGENT_TOOLSDIRECTORY n'y changent rien.
      #
      # `--python 3.12` garde l'intention d'origine : c'est cette version qui
      # est verifiee, pas « celle qui traine ».
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra framework-comparison --extra server

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Verify Diapason identity and version alignment
        run: uv run python scripts/check_project_identity.py

      - name: Audit complete Python dependency lock
        run: |
          uv audit --locked \
            --ignore-until-fixed GHSA-w8v5-vhqr-4h9v \
            --ignore GHSA-h35f-9h28-mq5c

      - name: Scan repository for committed secrets
        # v3 uses GitHub's Node 24 runtime. Pin the scanner itself to the last
        # known-good release because Gitleaks 8.30.1 has a confirmed default
        # rules regression that can silently report false negatives.
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.0"

  test:
    # RUNNER AUTO-HEBERGE — pansement, pas solution. A retirer quand la
    # facturation GitHub sera reglee (voir CLAUDE.md, section 2).
    #
    # Depuis le 24 aout 2026, aucun runner heberge par GitHub ne demarre :
    # « recent account payments have failed ». Mesure le 26 aout : un runner
    # AUTO-HEBERGE demarre, lui — le blocage ne porte que sur les minutes
    # facturees. Ce job tourne donc sur le Mac de Carlito.
    #
    # CE QUE CELA COUTE, et il faut le savoir : ce job verifiait Ubuntu, il
    # verifie maintenant macOS. Un defaut propre a Linux — un chemin, une
    # locale, une permission, une dependance systeme — ne sera plus attrape.
    # Un test qui tourne sur macOS vaut mieux qu'un test qui ne tourne pas,
    # mais ce n'est pas le meme test.
    #
    # POUR REVENIR EN ARRIERE : remplacer la ligne ci-dessous par
    #     runs-on: ubuntu-latest
    #
    # Note propre a CE job : `-n auto` occupe tous les coeurs. Pendant une
    # execution, la machine est prise. C'est le prix d'une CI qui tourne
    # chez soi.
    runs-on: [self-hosted, macos-local]
    steps:
      - uses: actions/checkout@v6

      # Pas de setup-python — meme raison que dans le job « lint » ci-dessus :
      # sur macOS son paquet code /Users/runner/hostedtoolcache en dur, et
      # echoue sur un runner auto-heberge. `uv` gere son propre Python.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra framework-comparison --extra server

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/diapason-python/Cargo.toml

      - name: Run tests
        # COVERAGE_CORE=sysmon uses CPython 3.12's sys.monitoring backend,
        # which is dramatically cheaper than the default C trace function.
        # -n auto fans the suite out across all runner cores via pytest-xdist.
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ -n auto -q --tb=short -m "not live and not cloud and not hub" \
            --cov=diapason \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # Windows job — empirically exercises the platform-specific code paths that
  # the Ubuntu `test` job can never reach: GlobalMemoryStatusEx RAM detection
  # (#373) and the cp9xx -> UTF-8 stdout reconfigure (#293). Also the only CI
  # job that builds + imports the mandatory `diapason_rust` PyO3 extension
  # on Windows.
  #
  # This used to read "Public repo -> Windows runner minutes are free".
  # The repository is PRIVATE, so Windows minutes are billed at 2x and
  # macOS at 10x. The sentence was not merely stale: it was the reason
  # nobody weighed what this matrix costs. As of 25 August 2026 no CI job
  # starts at all -- "recent account payments have failed" -- so nothing
  # here has been verified since. See CLAUDE.md, section 2.
  #
  # All `run:` steps use static commands only (no `github.event.*`
  # interpolation), so there is no workflow-injection surface here.
  test-windows:
    # Le runner `pc-bureau` verifie Windows reel depuis le 27 aout 2026. Son
    # service utilise l'installation native de Windows PowerShell 5.1 : le
    # premier passage a prouve que demander `pwsh` ajoutait une dependance
    # PowerShell Core absente et arretait les deux matrices avant le parseur.
    # `powershell` exerce aussi le lecteur UTF-8/BOM que les scripts livres
    # rencontreront vraiment sur les installations Windows prises en charge.
    # La politique du PC interdit les `.ps1` par defaut ; le second passage
    # s'est donc arrete sur le fichier temporaire genere par Actions avant
    # notre code. Le contournement reste borne a ce processus CI : il ne
    # modifie ni la politique de la machine ni celle de l'utilisateur.
    #
    # RUNNER_WINDOWS_LOCAL selectionne ce PC sans minutes facturees.
    # RUNNERS_GITHUB reste le repli pour windows-latest une fois la
    # facturation reparee.
    if: vars.RUNNER_WINDOWS_LOCAL == 'true' || vars.RUNNERS_GITHUB == 'true'
    runs-on: ${{ vars.RUNNER_WINDOWS_LOCAL == 'true' && fromJSON('["self-hosted","windows-local"]') || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = common; 3.13 = the supported ceiling — installing there guards
        # against a numpy/native wheel gap at the top of the range (#350), which
        # is exactly how the source-build failure slips in on Windows.
        python-version: ["3.12", "3.13"]
    defaults:
      # `bash` designe C:\Windows\System32\bash.exe sur ce PC, donc le lanceur
      # WSL, et aucune distribution Linux n'y est installee. Ces commandes
      # sont nativement Windows : cmd.exe evite une dependance WSL decorative.
      # Le seul vrai contrôle PowerShell garde son shell explicite et son
      # contournement borne ci-dessous.
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6

      - name: Parse every PowerShell deployment script
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          git ls-files '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $_),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # `setup-python` finit par appeler son propre `setup.ps1`, refuse par
        # la politique du PC. `uv` telecharge Python sans ce detour et garde
        # la matrice honnete : chaque venv utilise bien sa version demandee.
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra server

      # Pure-Python check — runs before the Rust build so a flaky toolchain
      # install can never mask the actual RAM-detection verification.
      - name: Verify Windows RAM detection (#373)
        run: |
          uv run python -c "from diapason.core.config import _total_ram_gb; ram = _total_ram_gb(); print(f'GlobalMemoryStatusEx RAM = {ram} GB'); assert ram > 0, f'Windows RAM detection returned {ram}, expected > 0'"

      - name: Run Windows-specific tests (hardware + CLI)
        run: |
          uv run pytest tests/hardware/test_hardware_profiles.py tests/cli/test_cli.py -v -m "not live and not cloud"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + import the PyO3 extension on Windows
        run: |
          uv run maturin develop --manifest-path rust/crates/diapason-python/Cargo.toml
          uv run python -c "import diapason_rust; print('diapason_rust imports on Windows OK')"

      - name: Smoke-test CLI
        run: |
          uv run diapason --version

  rust:
    # RUNNER AUTO-HEBERGE — meme pansement que `lint` et `test`, meme raison,
    # et le meme cout : ce job verifiait Ubuntu, il verifie maintenant macOS.
    # Un defaut propre a Linux ne sera plus attrape ici.
    #
    # Verifie en local le 26 aout 2026 avant d'etre deplace, pour ne pas
    # confier au runner un travail dont on ignore s'il passe. LES TROIS
    # etapes : `cargo clippy --workspace --all-targets -- -D warnings`,
    # `cargo test --workspace`, et `cargo audit` sur LES DEUX verrous
    # (rust/ et frontend/src-tauri/).
    #
    # La premiere version de ce commentaire annoncait une verification
    # locale qui n'avait couvert que les deux premieres. La CI a alors
    # trouve RUSTSEC-2026-0258 dans h2 — ce qu'on lui demande, mais
    # l'affirmation etait plus large que la mesure. Et lire l'apparence de
    # la sortie ne suffit pas : `$?` apres un tube rend le code de `tail`,
    # pas celui de cargo.
    #
    # POUR REVENIR EN ARRIERE : runs-on: ubuntu-latest
    runs-on: [self-hosted, macos-local]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked

      # DEUX VERROUS, DEUX EXIGENCES — et l'ecart est une decision, pas un
      # oubli.
      #
      # `rust/` est a nous, et il est PROPRE : zero vulnerabilite, zero
      # avertissement (mesure le 26 aout 2026, apres le passage d'anyhow en
      # 1.0.104 qui a leve RUSTSEC-2026-0190). Puisqu'il est propre, il tient
      # le cliquet le plus strict : `--deny warnings`. Un avis « non
      # maintenu » ou « unsound » y fera rougir la CI le jour ou il
      # apparaitra, au lieu de se fondre dans un bruit de fond.
      #
      # `frontend/src-tauri/` porte DIX-SEPT avertissements que nous ne
      # pouvons pas lever : seize liaisons GTK3 non maintenues et une
      # unsoundness dans `glib`, toutes tirees par `tauri` via `tray-icon`,
      # et toutes EXCLUSIVEMENT LINUX — `cargo tree --target
      # aarch64-apple-darwin` n'en montre aucune. Aucune n'est une
      # vulnerabilite : `cargo audit --json` compte zero. Elles disparaitront
      # quand Tauri quittera GTK3, pas avant, et rien ici ne peut l'avancer.
      # Ce verrou garde donc l'exigence par defaut : une VRAIE vulnerabilite
      # y fait toujours echouer la CI — c'est ainsi que RUSTSEC-2026-0258 (h2)
      # a ete trouvee le matin meme.
      - name: Audit Rust lockfiles
        run: |
          cargo audit --deny warnings
          cargo audit --file ../frontend/src-tauri/Cargo.lock
