# diapason.flashprime.online — site statique (vitrine, guides, téléchargements).
#
# 22/09/2026. Cohabite avec flashprime.online, en PRODUCTION sur la même
# machine : ce fichier ne touche jamais /etc/nginx/sites-available/flashprime.
# Voir deploy/vps/README.md pour ce qui tourne déjà sur ce VPS.
#
# Le préfixe « zz- » garde à flashprime son rang de serveur par défaut : nginx
# charge sites-enabled/* dans l'ordre alphabétique et le premier bloc `server`
# reçoit tout le trafic dont l'en-tête Host ne correspond à rien.

server {
    listen 80;
    listen [::]:80;
    server_name diapason.flashprime.online;

    # Le défi ACME reste en clair, sinon le renouvellement dépendrait du
    # certificat qu'il est censé renouveler. Racine hors du site : « rsync
    # --delete » effacerait sinon le jeton en plein renouvellement.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/diapason-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diapason.flashprime.online;

    # Pas de HTTP/2 ici. Deux raisons, dans l'ordre : nginx 1.24 (celui de
    # cette machine) ne connaît pas « http2 on; » — il veut « listen 443 ssl
    # http2; », essayé le 22/09, configuration refusée ; et sous 1.25, cette
    # forme-là s'applique au SOCKET, donc à tous les blocs `server` du port
    # 443 — flashprime.online passerait en HTTP/2 sans que personne l'ait
    # demandé. Un site statique n'en a pas besoin à ce prix.

    ssl_certificate     /etc/letsencrypt/live/diapason.flashprime.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diapason.flashprime.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # La racine porte la vitrine française ; les guides MkDocs vivent dans
    # son sous-dossier docs/. Pas d'`alias` : avec `try_files`, alias est un
    # piège connu de nginx — un sous-dossier sous la même racine n'en a pas
    # besoin.
    root  /var/www/diapason;
    index index.html;

    # Pas de HSTS ici : l'en-tête vaut pour tout le domaine, sous-domaines
    # compris, et l'imposer depuis Diapason engagerait flashprime.online.
    # Il se pose à la racine du domaine, ou nulle part.
    add_header X-Content-Type-Options  "nosniff"                      always;
    add_header X-Frame-Options         "SAMEORIGIN"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # MkDocs écrit des dossiers avec index.html ; $uri.html couvre les liens
    # sans barre finale.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Les gabarits du thème portent une empreinte dans leur nom : ils ne
    # changent jamais sous la même URL.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/diapason.access.log;
    error_log  /var/log/nginx/diapason.error.log;
}
