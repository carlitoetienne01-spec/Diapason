# diapason.flashprime.online — amorçage, AVANT le certificat.
#
# 22/09/2026. Ce fichier ne sert qu'une fois : il publie le défi ACME pour que
# certbot puisse émettre le certificat, puis zz-diapason.conf le remplace.
#
# Le préfixe « zz- » n'est pas décoratif : nginx charge sites-enabled/* dans
# l'ordre alphabétique et le PREMIER bloc `server` devient le serveur par
# défaut de l'adresse d'écoute. Un fichier nommé « diapason » passerait avant
# « flashprime » et détournerait tout le trafic dont l'en-tête Host est inconnu
# — dont les visites sur l'IP brute — vers Diapason. flashprime.online est en
# production ; il garde son rang.

server {
    listen 80;
    listen [::]:80;
    server_name diapason.flashprime.online;

    # La racine du défi vit HORS de l'arborescence du site : « rsync --delete »
    # sur /var/www/diapason effacerait sinon le jeton en plein renouvellement.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/diapason-acme;
        default_type "text/plain";
    }

    location / {
        root /var/www/diapason;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    access_log /var/log/nginx/diapason.access.log;
    error_log  /var/log/nginx/diapason.error.log;
}
